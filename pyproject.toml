[project]
name = "payzeno-ledger"
version = "1.0.0"
description = "Payzeno double-entry ledger — settlement import, reconciliation, payouts."
requires-python = ">=3.12,<3.13"
license = { text = "UNLICENSED" }
authors = [{ name = "Core Payments", email = "core-payments@payzeno.com" }]

dependencies = [
  "payzeno-contracts==3.4.0",          # cross-repo contract package, pypi.payzeno.internal
  "fastapi==0.111.0",
  "uvicorn[standard]==0.30.0",
  "sqlalchemy[asyncio]==2.0.30",
  "asyncpg==0.29.0",
  "alembic==1.13.1",
  "pydantic==2.7.1",
  "pydantic-settings==2.2.1",
  "apscheduler==3.10.4",
  "aioboto3==12.4.0",
  "httpx==0.27.0",
  "python-ulid==2.5.0",
  "prometheus-client==0.20.0",
  "structlog==24.1.0",
  "opentelemetry-sdk==1.24.0",
  "opentelemetry-instrumentation-fastapi==0.45b0",
  "redis==5.0.4",
]

[project.optional-dependencies]
dev = [
  "pytest==8.2.0",
  "pytest-asyncio==0.23.6",
  "pytest-cov==5.0.0",
  "testcontainers[postgres]==4.4.0",
  "ruff==0.4.4",
  "mypy==1.10.0",
  "types-aioboto3==12.4.0",
]

[project.scripts]
# the operator CLI — app/ops/cli.py. The second SessionFactory consumer.
payzeno-ledger-ops = "app.ops.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# payzeno-contracts is published to the internal index, everything else to PyPI.
[[tool.uv.index]]
name = "payzeno-internal"
url = "https://pypi.payzeno.internal/simple"

[tool.uv]
package = true

# ---------------------------------------------------------------------------
# ruff — lint + format. CI runs `ruff check app tests` and `ruff format --check`.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
extend-exclude = ["migrations/versions"]   # generated headers, revision ids, autogen noise

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                # isort
  "UP",               # pyupgrade
  "B",                # bugbear
  "ASYNC",            # blocking calls in async defs — this service is async top to bottom
  "S",                # bandit
  "C4", "SIM", "RET", "ARG", "TID", "RUF",
]
ignore = [
  "S101",   # assert — used everywhere in tests
  "B008",   # FastAPI Depends() in defaults is the framework idiom
  "RET504", # named return values are deliberate in the posting rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "S105", "S106"]
"app/ops/**" = ["T201"]                      # the CLI prints tables on purpose

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"                 # ADR 0002 — the layering is only readable absolute

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["payzeno_contracts"]

# ---------------------------------------------------------------------------
# mypy — strict on app/, lenient on tests and migrations.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true
exclude = "^migrations/versions/"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["apscheduler.*", "aioboto3.*", "testcontainers.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: needs the pg_engine fixture (real Postgres via testcontainers)",
  "slow: takes more than a second; excluded from the pre-commit run",
]
filterwarnings = [
  "error",
  # SQLAlchemy 2.0 emits this from the asyncpg dialect on rollback of a closed conn
  "ignore::DeprecationWarning:asyncpg.*",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/ops/*", "app/main.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abc.abstractmethod",
]

# Two gates, enforced separately in CI (see .github/workflows/ci.yml):
#   app/domain/**   100%   — pure logic, no excuse
#   app/services/** 85%
[tool.coverage.paths]
source = ["app", "/opt/payzeno/app"]
