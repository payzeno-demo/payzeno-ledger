name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.2.11"
  # payzeno-contracts comes from the internal index.
  UV_INDEX_PAYZENO_INTERNAL_USERNAME: ci
  UV_INDEX_PAYZENO_INTERNAL_PASSWORD: ${{ secrets.PAYZENO_INTERNAL_INDEX_TOKEN }}

jobs:
  # -------------------------------------------------------------------------
  # Fast gates. These must stay under two minutes — they are what people wait on.
  # -------------------------------------------------------------------------
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: ruff check
        run: uv run ruff check --output-format=github app tests migrations
      - name: ruff format --check
        run: uv run ruff format --check app tests migrations

  types:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      # strict on app/ only. tests and migrations are excluded in pyproject.toml
      # and that is a deliberate, argued-about decision — see ADR 0002.
      - run: uv run mypy --strict app

  # -------------------------------------------------------------------------
  # Unit / service / api tests. No database: everything here runs against the
  # in-process fixtures in tests/conftest.py.
  # -------------------------------------------------------------------------
  test:
    name: pytest (not integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: pytest
        run: uv run pytest -m "not integration" --cov=app --cov-report=xml --cov-report=term-missing --junitxml=junit.xml
      # Two gates, not one average. The domain layer is pure functions over
      # frozen dataclasses; there is no honest reason for it to be below 100.
      - name: coverage gate — app/domain (100%)
        run: uv run coverage report --include="app/domain/*" --fail-under=100
      - name: coverage gate — app/services (85%)
        run: uv run coverage report --include="app/services/*" --fail-under=85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            junit.xml
            coverage.xml

  # -------------------------------------------------------------------------
  # The real-Postgres suite. Slower, and the only place concurrency bugs are
  # observable — the in-process session fixture cannot express two connections
  # racing. PAYZ-2053. Do not "speed this up" by moving tests out of it.
  # -------------------------------------------------------------------------
  integration:
    name: pytest -m integration
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: payzeno
          POSTGRES_PASSWORD: payzeno
          POSTGRES_DB: payzeno_ledger_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payzeno"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://payzeno:payzeno@localhost:5432/payzeno_ledger_test
      # The pool has to be able to hold three sessions per sweep plus the drain,
      # same as production. A pool of 5 here passes and lies to you.
      DATABASE_POOL_SIZE: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: alembic upgrade head
        run: uv run alembic upgrade head
      # A migration without a working downgrade is a deploy we cannot roll back.
      - name: migration chain is linear and reversible
        run: |
          test "$(uv run alembic heads | wc -l)" -eq 1
          uv run alembic downgrade -1
          uv run alembic upgrade head
      - name: pytest -m integration
        run: uv run pytest -m integration -p no:randomly

  # -------------------------------------------------------------------------
  # The OpenAPI snapshot payzeno-api's contract test reads. If this drifts,
  # Platform's build breaks and they find out from us, not from CI.
  # -------------------------------------------------------------------------
  contract:
    name: openapi snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: regenerate and diff
        run: |
          uv run python -m app.ops.cli dump-openapi > /tmp/ledger-openapi.json
          diff -u contracts/ledger-openapi.json /tmp/ledger-openapi.json \
            || { echo "::error::contracts/ledger-openapi.json is stale — run 'make openapi' and commit it"; exit 1; }

  build:
    name: docker build
    runs-on: ubuntu-latest
    needs: [lint, types, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: false
          tags: payzeno/payzeno-ledger:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            payzeno_index_password=${{ secrets.PAYZENO_INTERNAL_INDEX_TOKEN }}
