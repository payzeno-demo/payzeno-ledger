# Alembic config for payzeno-ledger.
#
# sqlalchemy.url is deliberately EMPTY. migrations/env.py reads DATABASE_URL off
# app.config.Settings and swaps the asyncpg driver for psycopg2, because Alembic
# runs synchronously against SingleConnectionSessionFactory. Putting a URL here
# would give us two sources of truth and one of them would be wrong in production.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Revisions are named NNNN_<slug>.py by hand and the revision id is the NNNN.
# The chain is LINEAR — 0001 -> 0033, no branches, no merge revisions. If you
# find yourself writing `alembic merge`, rebase instead.
file_template = %%(rev)s_%%(slug)s

sqlalchemy.url =

# We run migrations as a separate ECS task before the service rolls, so a long
# lock wait is a deploy hang, not a request timeout. Fail fast and retry.
[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
